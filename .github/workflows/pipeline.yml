name: Gioiello Vitale Pipeline

on:
  # Exécution automatique toutes les 4 heures
  schedule:
    - cron: '0 */4 * * *'
  
  # Permet de lancer le test manuellement depuis l'onglet Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupération du code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape 2 : Installation de Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # Étape 3 : Installation des dépendances (feedparser et pytz)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser pytz

      # Étape 4 : Exécution du script principal (situé à la racine)
      - name: Run main script
        run: python main.py

      # Étape 5 : Sauvegarde automatique des résultats sur GitHub
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.io'
          git add feed_output.json queue_status.json version.json 2>/dev/null || true
          git commit -m "Auto: Update feed [skip ci]" || echo "No changes to commit"
          git push
