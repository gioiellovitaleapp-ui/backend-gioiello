name: Pipeline Gioiello Vitale

on:
  schedule:
    # Exécution automatique toutes les 4 heures (à adapter si besoin)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Permet un déclenchement manuel depuis l'onglet Actions

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Indispensable pour permettre au bot de pousser les modifications

    steps:
      # 1. Récupération du code source du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configuration de l'environnement Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Installation des dépendances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser pytz

      # 4. Exécution du pipeline Python principal
      - name: Run main script
        run: python main.py

      # 5. Commit et Push automatique des fichiers générés sur la branche main
      - name: Commit and push updated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Ajout des fichiers modifiés et suivis
          git add feed_output.json queue_status.json
          
          # Vérifie s'il y a des changements avant de commiter (évite les erreurs si rien n'a bougé)
          git diff --staged --quiet || git commit -m "chore: update feed output and queue status [skip ci]"
          
          # Pousse les modifications sur la branche principale
          git push

      # 6. Déploiement automatique du feed sur la branche gh-pages pour l'accès public
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          force_orphan: true
          keep_files: false
